<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anime Buddy Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout concept: a studio booth. Left, a framed portrait stage with a three-way style dial and an expression rail.
   Right, a control rack that switches between Customize and Chat. Palette: cool paper-blue ground, ink text, one hot sakura accent. */
:root{
  --bg:#EDF0F7; --panel:#FFFFFF; --panel2:#F2F4FB; --ink:#171A2E; --muted:#596080; --line:#D9DEEC;
  --accent:#DD2C69; --accent-ink:#FFFFFF; --ok:#0E9C86; --focus:#2F6FE0;
  --display:'Dela Gothic One','M PLUS Rounded 1c',system-ui,sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F1F; --panel:#171A31; --panel2:#1F2342; --ink:#EEF0FB; --muted:#A3AACA; --line:#2B3057;
    --accent:#FF5C93; --accent-ink:#1B0610; --ok:#35D0B5; --focus:#8DB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F1F; --panel:#171A31; --panel2:#1F2342; --ink:#EEF0FB; --muted:#A3AACA; --line:#2B3057;
  --accent:#FF5C93; --accent-ink:#1B0610; --ok:#35D0B5; --focus:#8DB0FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-block:20px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.shell{max-width:1080px;margin:0 auto}
.top{display:flex;gap:14px 20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.top p{margin:8px 0 0;color:var(--muted);max-width:48ch}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;font-weight:700}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.status.on i{background:var(--ok)}
.booth{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.booth{grid-template-columns:minmax(0,1fr)}}
.stage-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:grid;gap:12px;min-width:0;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.stage-card{position:static;max-width:460px;width:100%;margin:0 auto}}
.dial{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--panel2);padding:5px;border-radius:14px}
.dial button{border:0;background:transparent;padding:8px 4px;border-radius:10px;cursor:pointer;display:grid;text-align:center;line-height:1.2}
.dial b{font-family:var(--display);font-weight:400;font-size:15px}
.dial span{font-size:11px;color:var(--muted)}
.dial button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dial button[aria-pressed="true"] span{color:inherit;opacity:.9}
.art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:#cfd6e6}
.art svg{width:100%;height:100%;display:block;cursor:pointer}
#float{animation:bob 5.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.blink{transform-box:fill-box;transform-origin:50% 40%;transition:transform .07s}
.iris{transform:translate(calc(var(--lx,0)*1px),calc(var(--ly,0)*1px));transition:transform .14s ease-out}
.irisL{transform:translate(calc(var(--lx,0)*-1px),calc(var(--ly,0)*1px))}
@media (prefers-reduced-motion:reduce){#float{animation:none}.iris{transition:none}}
.speech{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.95);color:#1B1D33;border-radius:14px 14px 14px 4px;padding:8px 12px 9px;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none}
.speech b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#B8245A;font-weight:800}
.speech span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.plate{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 4px}
.plate strong{font-family:var(--display);font-weight:400;font-size:22px}
.plate span{font-size:13px;color:var(--muted)}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.mood[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rack{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:14px 8px;cursor:pointer;font-weight:800;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:6px 18px 18px}
.grp{display:grid;gap:9px;padding-block:14px;border-bottom:1px dashed var(--line);min-width:0}
.grp:last-of-type{border-bottom:0}
.lab{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.optrow,.swrow{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0}
input[type="text"]{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 12px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
.chat-head strong{font-family:var(--display);font-weight:400;font-size:18px}
.log{display:flex;flex-direction:column;gap:10px;height:min(400px,52vh);min-height:260px;overflow-y:auto;padding:14px;background:var(--panel2);border-radius:16px}
.msg{max-width:88%;padding:9px 13px;border-radius:16px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.quick .mood{font-size:13px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0}
.foot{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
</style>

<div class="shell">
  <header class="top">
    <div>
      <h1>Anime Buddy Studio</h1>
      <p>Pick a style, design your companion, then talk to it. Click your buddy to say hi.</p>
    </div>
    <span class="status" id="brainChip"><i></i><span id="brainText">Checking brain</span></span>
  </header>

  <main class="booth">
    <section class="stage-card" aria-label="Your companion">
      <div class="dial" id="styleDial" role="group" aria-label="Art style"></div>
      <div class="art" id="art">
        <svg id="svg" viewBox="0 0 400 500" role="img" aria-label="Anime companion">
          <g id="bg"></g><g id="float"><g id="char"></g></g>
        </svg>
        <div class="speech"><b id="spName"></b><span id="spText"></span></div>
      </div>
      <div class="plate"><strong id="plName"></strong><span id="plMeta"></span></div>
      <div class="moods" id="moods" role="group" aria-label="Expression"></div>
    </section>

    <section class="rack">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabCustom" aria-selected="true" aria-controls="paneCustom">Customize</button>
        <button type="button" role="tab" id="tabChat" aria-selected="false" aria-controls="paneChat">Chat</button>
      </div>
      <div class="pane" id="paneCustom" role="tabpanel" aria-labelledby="tabCustom"></div>
      <div class="pane" id="paneChat" role="tabpanel" aria-labelledby="tabChat" hidden>
        <div class="chat-head"><strong id="chName"></strong><span class="hint" id="chHint"></span></div>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="quick" id="quick"></div>
        <form class="sendrow" id="chatForm" autocomplete="off">
          <input type="text" id="msgIn" maxlength="500" placeholder="Type a message" aria-label="Message">
          <button type="submit" class="btn primary" id="sendBtn">Send</button>
        </form>
      </div>
    </section>
  </main>
  <p class="foot">Your buddy is saved in this browser.</p>
</div>

<script>
(function(){
'use strict';
var CX=200;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16);});}
function rgb2hex(a){return '#'+a.map(function(v){return Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');}).join('');}
function mix(a,b,t){var A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map(function(v,i){return v+(B[i]-v)*t;}));}
function dark(c,t){return mix(c,'#000000',t);}
function lite(c,t){return mix(c,'#ffffff',t);}

/* ---------- data ---------- */
var SKIN=[['Porcelain','#FFE3D3'],['Light','#F7CBAA'],['Tan','#E8AE83'],['Bronze','#C68660'],['Brown','#98603E'],['Deep','#6B4029']];
var HAIRC=[['Ink','#2A2335'],['Chestnut','#6B4331'],['Honey','#E7BE63'],['Sakura','#F06C9B'],['Sky','#4FA3E8'],['Silver','#DCDFEA'],['Crimson','#C93C4A'],['Mint','#47C2A0']];
var EYEC=[['Blue','#4A90E2'],['Green','#2FBF8F'],['Brown','#8B5A2B'],['Rose','#E0457B'],['Violet','#9B6BFF'],['Amber','#E8A32A']];
var OUTC=[['Pink','#E0457B'],['Blue','#2F6FE0'],['Black','#232634'],['White','#F2F3F8'],['Teal','#2FA37F'],['Amber','#E8A32A'],['Violet','#7A4BD6'],['Red','#C93C4A']];
var HAIRS=[['short','Short'],['spiky','Spiky'],['long','Long'],['twin','Twin tails'],['bob','Bob'],['pony','Ponytail']];
var OUTFITS=[['hoodie','Hoodie'],['uniform','Uniform'],['tee','T-shirt'],['jacket','Jacket'],['kimono','Kimono']];
var NAMES={boy:['Kai','Ren','Haru','Sora','Akira','Riku','Yuto','Taro'],girl:['Mio','Sakura','Hana','Yui','Rin','Luna','Aoi','Emi']};

var ST={
  cute:{k:'cute',label:'Cute',sub:'Soft and round',head:{w:106,top:74,cy:196,chin:304,chinW:58,cs:0},ey:226,ed:46,ny:262,my:283,sy:334,sw:92,nw:21,ol:3.2,olc:'#3A2848',lash:'#2B1B3D',bang:166,sideY:226,lift:14,asym:0,earW:10,earH:16,sheen:11},
  cool:{k:'cool',label:'Cool',sub:'Sharp and sleek',head:{w:80,top:84,cy:196,chin:324,chinW:14,cs:16},ey:214,ed:40,ny:254,my:290,sy:376,sw:150,nw:22,ol:3.4,olc:'#17141F',lash:'#0F0D18',bang:182,sideY:262,lift:16,asym:20,earW:12,earH:20,sheen:7},
  real:{k:'real',label:'Realistic',sub:'Lifelike',head:{w:74,top:80,cy:196,chin:324,chinW:34,cs:6},ey:208,ed:36,ny:255,my:290,sy:376,sw:132,nw:25,ol:1.2,olc:'#4A3228',lash:'#2A1C18',bang:172,sideY:250,lift:12,asym:0,earW:12,earH:22,sheen:0}
};

var EXPR={
  neutral:{label:'Neutral',open:1,arc:0,tilt:0,lift:0,mouth:'neutral',blush:0,look:[0,0],fx:''},
  happy:{label:'Happy',open:1,arc:0,tilt:-0.15,lift:2,mouth:'smile',blush:0.5,look:[0,0],fx:''},
  joy:{label:'Joy',open:1,arc:3,tilt:-0.2,lift:4,mouth:'big',blush:0.8,look:[0,0],fx:'sparkle'},
  surprised:{label:'Surprised',open:1.14,arc:0,tilt:-0.2,lift:9,mouth:'o',blush:0,look:[0,0],fx:'sweat'},
  sad:{label:'Sad',open:0.92,arc:0,tilt:-1,lift:0,mouth:'frown',blush:0,look:[0,2],fx:'tear'},
  angry:{label:'Angry',open:0.82,arc:0,tilt:1,lift:-2,mouth:'grit',blush:0,look:[0,0],fx:'vein'},
  shy:{label:'Shy',open:0.86,arc:0,tilt:-0.4,lift:0,mouth:'wave',blush:1,look:[-2,3],fx:''},
  thinking:{label:'Thinking',open:1,arc:0,tilt:0,lift:0,mouth:'side',blush:0,look:[3,-3],fx:'think',asym:8},
  wink:{label:'Wink',open:1,arc:2,tilt:-0.1,lift:2,mouth:'smile',blush:0.5,look:[0,0],fx:''},
  sleepy:{label:'Sleepy',open:0.42,arc:0,tilt:0.1,lift:-3,mouth:'yawn',blush:0.2,look:[0,2],fx:'zzz'}
};
var MOODS=Object.keys(EXPR);

var PERSONA={
  cheerful:{label:'Cheerful',desc:'Sunny, upbeat and encouraging. Loves cheering you on.',idle:'happy',
    greet:function(n){return {mood:'joy',text:"Hi hi! I'm "+n+"! I'm so happy you're here. What should we talk about?"};},
    poke:[{mood:'surprised',text:'Eep! Hehe, that tickles!'},{mood:'joy',text:'Yay, you poked me! Do it again!'}]},
  shy:{label:'Shy',desc:'Soft-spoken and easily flustered, but very kind and sincere.',idle:'shy',
    greet:function(n){return {mood:'shy',text:"Um... h-hello. I'm "+n+". I'm glad you came to talk to me."};},
    poke:[{mood:'shy',text:'Eh?! W-why did you poke me...'},{mood:'surprised',text:'Aah! You startled me!'}]},
  tsundere:{label:'Tsundere',desc:'Acts tough and teasing at first, but secretly caring and loyal.',idle:'neutral',
    greet:function(n){return {mood:'angry',text:"Hmph. I'm "+n+". It's not like I was waiting for you or anything... so, what do you want?"};},
    poke:[{mood:'angry',text:"Hey! Don't just poke people!"},{mood:'shy',text:"...Fine, you can do that. Just once."}]},
  calm:{label:'Calm',desc:'Gentle, peaceful and patient. Speaks softly and thoughtfully.',idle:'neutral',

  playful:{label:'Playful',desc:'Mischievous and funny. Loves jokes, puns and teasing.',idle:'wink',
    greet:function(n){return {mood:'wink',text:"Well well, a visitor! I'm "+n+". Ready for some fun, or should I tell a joke first?"};},
    poke:[{mood:'wink',text:'Hehe, caught you poking!'},{mood:'joy',text:'Boop! Now you owe me a snack.'}]},
  wise:{label:'Wise',desc:'A thoughtful mentor who explains things clearly and kindly.',idle:'thinking',
    greet:function(n){return {mood:'happy',text:"Welcome. I'm "+n+". Ask me anything and we will figure it out together."};},
    poke:[{mood:'thinking',text:'Hmm, curious. What are you testing?'},{mood:'happy',text:'A gentle poke is a fine way to say hello.'}]}
};

var DEFAULT={style:'cute',gender:'girl',name:'Mio',persona:'cheerful',skin:1,hair:'twin',hairCol:3,eye:0,outfit:'uniform',outfitCol:1};

/* ---------- drawing helpers ---------- */
function headPath(H){
  var w=H.w,top=H.top,cy=H.cy,chin=H.chin,chinW=H.chinW,cx=CX,k=(chin-cy)*0.62,c2y=chin-(H.cs||0);
  return 'M'+cx+','+top+' C'+(cx+w*0.68)+','+top+' '+(cx+w)+','+(cy-48)+' '+(cx+w)+','+(cy+2)+
    ' C'+(cx+w)+','+(cy+k)+' '+(cx+chinW)+','+c2y+' '+cx+','+chin+
    ' C'+(cx-chinW)+','+c2y+' '+(cx-w)+','+(cy+k)+' '+(cx-w)+','+(cy+2)+
    ' C'+(cx-w)+','+(cy-48)+' '+(cx-w*0.68)+','+top+' '+cx+','+top+'Z';
}
function star4(x,y,r,f,op){return '<path d="M'+x+','+(y-r)+' Q'+x+','+y+' '+(x+r)+','+y+' Q'+x+','+y+' '+x+','+(y+r)+' Q'+x+','+y+' '+(x-r)+','+y+' Q'+x+','+y+' '+x+','+(y-r)+'Z" fill="'+f+'"'+(op?' opacity="'+op+'"':'')+'/>';}
function heart(x,y,s,f,op){return '<path d="M'+x+','+(y+s)+' C'+(x-s*1.6)+','+(y-s*0.2)+' '+(x-s*0.7)+','+(y-s*1.2)+' '+x+','+(y-s*0.35)+' C'+(x+s*0.7)+','+(y-s*1.2)+' '+(x+s*1.6)+','+(y-s*0.2)+' '+x+','+(y+s)+'Z" fill="'+f+'" opacity="'+op+'"/>';}
function starN(cx,cy,R,r,n){var d='';for(var i=0;i<n*2;i++){var a=-Math.PI/2+i*Math.PI/n,rad=i%2?r:R;d+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1);}return d+'Z';}

function bgSvg(k){
  if(k==='cute'){
    var s='<defs><linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD3E4"/><stop offset="1" stop-color="#FFF0D2"/></linearGradient></defs><rect width="400" height="500" fill="url(#bgc)"/>';
    s+='<circle cx="60" cy="90" r="70" fill="#fff" opacity=".35"/><circle cx="350" cy="140" r="90" fill="#FFB7D2" opacity=".3"/><circle cx="330" cy="430" r="80" fill="#fff" opacity=".3"/><circle cx="50" cy="400" r="60" fill="#FFC8DC" opacity=".35"/>';
    s+=heart(46,200,9,'#FF6FA0',.55)+heart(356,300,12,'#FF6FA0',.5)+heart(80,330,7,'#fff',.8)+heart(330,60,8,'#fff',.8)+heart(30,60,6,'#FF8FB5',.6);
    s+=star4(330,200,10,'#FFE27A',.95)+star4(70,140,8,'#fff',.95)+star4(360,380,9,'#fff',.9)+star4(40,280,7,'#FFE27A',.9)+star4(300,30,7,'#fff',.9);
    return s;
  }
  if(k==='cool'){
    var c='<defs><linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241B52"/><stop offset="1" stop-color="#0B0A1C"/></linearGradient></defs><rect width="400" height="500" fill="url(#bgk)"/>';
    c+='<polygon points="0,300 400,130 400,210 0,380" fill="#FF2E88" opacity=".9"/><polygon points="0,400 400,230 400,252 0,422" fill="#19D3F3" opacity=".9"/><polygon points="0,60 400,-110 400,-60 0,110" fill="#19D3F3" opacity=".25"/>';
    c+='<circle cx="200" cy="205" r="172" fill="none" stroke="#19D3F3" stroke-opacity=".35" stroke-width="3"/><circle cx="200" cy="205" r="150" fill="none" stroke="#FF2E88" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="6 10"/>';
    for(var i=0;i<9;i++){c+='<line x1="'+(30+i*45)+'" y1="0" x2="'+(10+i*45)+'" y2="500" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>';}
    c+=star4(60,70,12,'#19D3F3',.9)+star4(345,95,8,'#FF2E88',.9)+star4(365,330,10,'#fff',.6)+star4(36,420,8,'#19D3F3',.7);
    return c;
  }
  var r='<defs><radialGradient id="bgr" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#F6F8FC"/><stop offset=".6" stop-color="#CBD5E6"/><stop offset="1" stop-color="#97A5BF"/></radialGradient></defs><rect width="400" height="500" fill="url(#bgr)"/>';

/* hair */
function capPath(S,H,o){
  var cx=CX,w=H.w+8,cy=H.cy,by=S.bang,d,i;
  if(o.spikyCap){
    var f=[1,1.12,0.96,1.18,0.94,1.2,0.96,1.14,0.97,1.1,1],m=f.length-1,ry=(cy+10)-(H.top-S.lift);
    d='';
    for(i=0;i<=m;i++){
      var th=Math.PI-Math.PI*i/m,ff=(i===0||i===m)?1:f[i];
      d+=(i===0?'M':' L')+(cx+w*ff*Math.cos(th)).toFixed(1)+','+((cy+10)-ry*ff*Math.sin(th)).toFixed(1);
    }
  }else{
    var Y=(H.top-S.lift-0.25*(cy+10))/0.75;
    d='M'+(cx-w)+','+(cy+10)+' C'+(cx-w-10)+','+Y+' '+(cx+w+10)+','+Y+' '+(cx+w)+','+(cy+10);
  }
  var sy=o.sideY||S.sideY,n=o.n||5,x0=cx+w-12,x1=cx-w+12,off=[8,-2,12,0,14,2,10];
  d+=' L'+(cx+w-3)+','+sy+' L'+x0+','+(by-22);
  for(i=0;i<n;i++){
    var xa=x0+(x1-x0)*i/n,xb=x0+(x1-x0)*(i+1)/n,tx=(xa+xb)/2;
    var ya=by-22-(i%2)*5,yb=by-22-((i+1)%2)*5;
    var ty=by+off[i%7]+((S.asym&&i<n/2)?S.asym:0);
    if(o.spiky){d+=' L'+tx+','+(ty+8)+' L'+xb+','+yb;}
    else{d+=' Q'+tx+','+(2*ty-(ya+yb)/2)+' '+xb+','+yb;}
  }
  d+=' L'+(cx-w+3)+','+sy+' L'+(cx-w)+','+(cy+10)+'Z';
  return d;
}

var JOKES=['Why did the ramen go to school? To get a little noodle-dge!','What do you call a sleepy anime hero? A nap-protagonist.','Why was the manga so calm? It had a lot of panels of peace.'];
function localReply(text,cfg){
  var t=text.toLowerCase(),p=cfg.persona,n=cfg.name,r;
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  var tone={cheerful:['joy','Yay! '],shy:['shy','Um... '],tsundere:['angry','Hmph. '],calm:['happy',''],playful:['wink','Hehe. '],wise:['thinking','Hmm. ']}[p];
  if(/\b(hi|hello|hey|yo)\b/.test(t))r=[tone[0],tone[1]+"Hello! I'm "+n+". Nice to see you."];
  else if(/your name|who are you/.test(t))r=['happy',"I'm "+n+", your anime buddy. You made me yourself!"];
  else if(/how are you|how's it going/.test(t))r=['happy',tone[1]+"I'm doing well, thanks for asking. How about you?"];
  else if(/joke|funny|laugh/.test(t))r=['joy',pick(JOKES)];
  else if(/thank/.test(t))r=['shy',tone[1]+"You're welcome!"];
  else if(/love|like you|cute|pretty|cool/.test(t))r=['shy',tone[1]+"Y-you think so? Thank you."];
  else if(/sad|tired|lonely|bad day/.test(t))r=['sad',"I'm sorry you feel that way. I'm here, and I'm listening."];
  else if(/bye|goodnight|see you/.test(t))r=['sleepy','Bye bye! Come back soon.'];
  else r=['thinking',"My smart brain isn't switched on in this view, so I can only handle simple chat. Try asking me for a joke!"];
  return {mood:r[0],text:r[1]};
}

  var gRow=makeRow([{id:'boy',label:'Boy'},{id:'girl',label:'Girl'}],function(){return cfg.gender;},applyGender);
  host.appendChild(group('Companion',gRow));

  var nm=document.createElement('div');nm.className='namerow';
  nm.innerHTML='<input type="text" id="nameIn" maxlength="14" aria-label="Name" autocomplete="off"><button type="button" class="btn" id="diceBtn">Random</button>';
  host.appendChild(group('Name',nm));
  $('nameIn').value=cfg.name;
  $('nameIn').addEventListener('input',function(e){cfg.name=e.target.value.trim().slice(0,14)||'Buddy';saveCfg();renderLabels();});
  $('diceBtn').addEventListener('click',function(){var a=NAMES[cfg.gender];cfg.name=a[Math.floor(Math.random()*a.length)];$('nameIn').value=cfg.name;saveCfg();renderLabels();setSpeech(PERSONA[cfg.persona].greet(cfg.name).text);});

  var pw=document.createElement('div');pw.style.display='grid';pw.style.gap='8px';
  pw.appendChild(makeRow(Object.keys(PERSONA).map(function(k){return {id:k,label:PERSONA[k].label};}),function(){return cfg.persona;},function(id){cfg.persona=id;saveCfg();setExpr(PERSONA[id].idle);var g=PERSONA[id].greet(cfg.name);setSpeech(g.text);}));
  var pd=document.createElement('p');pd.className='hint';pd.id='personaDesc';pw.appendChild(pd);
  host.appendChild(group('Personality',pw));

  host.appendChild(group('Skin tone',makeRow(SKIN.map(function(s,i){return {id:i,label:s[0],color:s[1]};}),function(){return cfg.skin;},function(i){cfg.skin=i;changed();},true)));
  host.appendChild(group('Hairstyle',makeRow(HAIRS.map(function(h){return {id:h[0],label:h[1]};}),function(){return cfg.hair;},function(id){cfg.hair=id;changed();})));
  host.appendChild(group('Hair color',makeRow(HAIRC.map(function(s,i){return {id:i,label:s[0],color:s[1]};}),function(){return cfg.hairCol;},function(i){cfg.hairCol=i;changed();},true)));
  host.appendChild(group('Eye color',makeRow(EYEC.map(function(s,i){return {id:i,label:s[0],color:s[1]};}),function(){return cfg.eye;},function(i){cfg.eye=i;changed();},true)));
  host.appendChild(group('Outfit',makeRow(OUTFITS.map(function(h){return {id:h[0],label:h[1]};}),function(){return cfg.outfit;},function(id){cfg.outfit=id;changed();})));
  host.appendChild(group('Outfit color',makeRow(OUTC.map(function(s,i){return {id:i,label:s[0],color:s[1]};}),function(){return cfg.outfitCol;},function(i){cfg.outfitCol=i;changed();},true)));

  var act=document.createElement('div');act.className='actions';
  act.innerHTML='<button type="button" class="btn primary" id="surpriseBtn">Surprise me</button><button type="button" class="btn" id="resetBtn">Reset</button>';
  host.appendChild(act);
  $('surpriseBtn').addEventListener('click',randomize);
  $('resetBtn').addEventListener('click',function(){cfg=Object.assign({},DEFAULT);$('nameIn').value=cfg.name;saveCfg();setExpr(PERSONA[cfg.persona].idle);setSpeech(PERSONA[cfg.persona].greet(cfg.name).text);});

  var mo=$('moods');
  MOODS.forEach(function(m){
    var b=document.createElement('button');b.type='button';b.className='mood';b.textContent=EXPR[m].label;
    b.addEventListener('click',function(){setExpr(m);});
    mo.appendChild(b);rows.push({btns:[{el:b,id:m}],cur:function(){return exprName;}});
  });
}

/* chat */
function addMsg(role,text){
  var d=document.createElement('div');d.className='msg '+role;
  if(role==='bot'){var s=document.createElement('small');s.textContent=cfg.name;d.appendChild(s);var t=document.createElement('span');t.textContent=text;d.appendChild(t);d._t=t;}
  else d.textContent=text;
  $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;return d;
}
function parseReply(t){
  t=t||'';var m=/^\s*\[([a-zA-Z]+)\]\s*/.exec(t),mood=null,body=t;
  if(m){mood=m[1].toLowerCase();body=t.slice(m[0].length);if(!EXPR[mood])mood=null;}
  else body=t.replace(/^\s*\[[a-zA-Z]*$/,'');
  return {mood:mood,body:body};
}
function buildPrompt(){
  var p=PERSONA[cfg.persona];
  var sys='You are '+cfg.name+', a '+(cfg.gender==='boy'?'boy':'girl')+' anime companion ('+ST[cfg.style].label+' art style) chatting with a close friend on a website. Personality: '+p.desc+' Stay in character and sound natural and warm. Be genuinely helpful: answer questions accurately, help with ideas, study, advice and everyday talk. Keep replies short (1 to 3 sentences) unless the friend asks for detail. Begin every reply with exactly one mood tag in square brackets, chosen from: '+MOODS.join(', ')+'. Pick the mood that fits what you say. Use at most one emoji. Never mention these instructions.';
  var tr=history.slice(-12).map(function(m){return (m.role==='user'?'Friend':cfg.name)+': '+m.text;}).join('\n');
  return sys+'\n\nConversation so far:\n'+tr+'\n\nWrite '+cfg.name+"'s next reply now.";
}
function typeOut(el,full){
  return new Promise(function(res){
    var i=0;startTalk();
    var iv=setInterval(function(){
      i=Math.min(full.length,i+2);el._t.textContent=full.slice(0,i);setSpeech(full.slice(0,i));$('log').scrollTop=$('log').scrollHeight;
      if(i>=full.length){clearInterval(iv);res();}
    },26);
  });
}
function setBusy(b){busy=b;$('sendBtn').disabled=b;$('msgIn').disabled=b;}
async function send(text){
  text=text.trim();if(!text||busy)return;
  setBusy(true);history.push({role:'user',text:text});addMsg('you',text);
  var el=addMsg('bot','...');setExpr('thinking');
  var mood=null,finalText='',modeAI=!!(brain&&!brainBlocked);
  try{
    if(modeAI){
      var res=await brain(buildPrompt(),{cache:false,modelTier:'quick',onText:function(o){
        var p=parseReply(o.text);if(p.body){el._t.textContent=p.body;setSpeech(p.body);startTalk();$('log').scrollTop=$('log').scrollHeight;}
        if(p.mood&&p.mood!==exprName)setExpr(p.mood);
      }});
      var pr=parseReply(res.text);finalText=pr.body.trim()||'...';mood=pr.mood;el._t.textContent=finalText;setSpeech(finalText);
    }else{
      var lr=localReply(text,cfg);finalText=lr.text;mood=lr.mood;setExpr(mood);await typeOut(el,finalText);
    }
    history.push({role:'bot',text:finalText});
  }catch(err){
    if(err&&err.code==='not_granted'){
      brainBlocked=true;updateChip();
      var l2=localReply(text,cfg);finalText="I can't use my smart brain because it wasn't allowed here, so I'm in simple mode. "+l2.text;mood=l2.mood;
      el._t.textContent=finalText;setSpeech(finalText);history.push({role:'bot',text:finalText});
    }else if(err&&err.code==='rate_limited'){
      finalText='Whoa, that was a lot of chatting. Give me a moment and try again.';mood='sleepy';el._t.textContent=finalText;setSpeech(finalText);
    }else{
      finalText='My brain got tangled for a second. Could you send that again?';mood='sad';el._t.textContent=finalText;setSpeech(finalText);
    }
  }
  stopTalk();
  if(mood)setExpr(mood,9000);else setExpr(PERSONA[cfg.persona].idle);
  setBusy(false);$('msgIn').focus();
}
function updateChip(){
  var chip=$('brainChip'),on=!!(brain&&!brainBlocked);
  chip.className='status'+(on?' on':'');
  $('brainText').textContent=on?'AI brain ready':(brainBlocked?'Simple chat mode':'Simple chat mode');
  $('chHint').textContent=on?'Real AI replies, in character.':'Simple replies only. The AI brain is not connected here.';
}
function buildQuick(){
  var q=$('quick');
  ['Tell me a joke','How was your day?','Explain black holes simply','Give me a study tip'].forEach(function(t){
    var b=document.createElement('button');b.type='button';b.className='mood';b.textContent=t;
    b.addEventListener('click',function(){send(t);});q.appendChild(b);
  });
}
function selectTab(which){
  var c=which==='custom';
  $('tabCustom').setAttribute('aria-selected',String(c));$('tabChat').setAttribute('aria-selected',String(!c));
  $('paneCustom').hidden=!c;$('paneChat').hidden=c;
  if(!c)$('log').scrollTop=$('log').scrollHeight;
}

function boot(){
  cfg=loadCfg();exprName=PERSONA[cfg.persona].idle;E=EXPR[exprName];
  buildControls();buildQuick();
  render();updateChip();
  var g=PERSONA[cfg.persona].greet(cfg.name);setSpeech(g.text);
  addMsg('bot',g.text);history.push({role:'bot',text:g.text});
  $('tabCustom').addEventListener('click',function(){selectTab('custom');});
  $('tabChat').addEventListener('click',function(){selectTab('chat');});
  $('chatForm').addEventListener('submit',function(e){e.preventDefault();var v=$('msgIn').value;$('msgIn').value='';send(v);});
  $('art').addEventListener('click',function(){
    if(busy)return;
    var p=PERSONA[cfg.persona].poke,r=p[Math.floor(Math.random()*p.length)];
    setExpr(r.mood,3200);setSpeech(r.text);
  });
  window.addEventListener('pointermove',function(e){
    var r=$('svg').getBoundingClientRect();
    var dx=(e.clientX-(r.left+r.width/2))/(window.innerWidth/2),dy=(e.clientY-(r.top+r.height*0.42))/(window.innerHeight/2);
    pointer=[clamp(dx,-1,1)*4,clamp(dy,-1,1)*3];applyLook();
  },{passive:true});
  blinkLoop();
  try{
    var cl=window.claude;
    if(cl&&cl.use){cl.use('sample').then(function(s){brain=s||null;updateChip();}).catch(function(){brain=null;updateChip();});}
  }catch(e){}
}

if(typeof globalThis!=='undefined'&&globalThis.__TEST__){
  globalThis.__buddy={build:build,ST:ST,EXPR:EXPR,HAIRS:HAIRS,OUTFITS:OUTFITS,DEFAULT:DEFAULT,SKIN:SKIN,HAIRC:HAIRC,OUTC:OUTC,EYEC:EYEC,localReply:localReply,parseReply:parseReply};
}else{
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
}
})();
</script>
